<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SensibleJS Stress Test</title>
    <script src="../sensibljs.js" defer></script>
    <style>
        [s-cloak] { display: none !important; }
        body { font-family: 'SF Mono', monospace; background: #0a0a0a; color: #e5e5e5; padding: 24px; line-height: 1.6; }
        h1 { color: #6366f1; margin-bottom: 8px; }
        h2 { color: #888; font-size: 1rem; margin: 24px 0 8px; }
        .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        button { background: #6366f1; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
        button:hover { background: #818cf8; }
        button.outline { background: transparent; border: 1px solid #333; color: #888; }
        button.outline:hover { border-color: #6366f1; color: #6366f1; }
        button.red { background: #ef4444; }
        #log { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; font-size: 0.8rem; white-space: pre-wrap; min-height: 200px; max-height: 500px; overflow-y: auto; }
        .test-area { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
        .item { padding: 2px 8px; font-size: 0.75rem; color: #888; }
        .pass { color: #22c55e; }
        .warn { color: #eab308; }
        .fail { color: #ef4444; }
    </style>
</head>
<body s-cloak>
    <h1>SensibleJS Stress Test</h1>
    <p style="color: #888; margin-bottom: 24px;">Push the library to its limits. Check rendering speed, update throughput, and memory behavior.</p>

    <div class="controls">
        <button onclick="runAllTests()">Run All Tests</button>
        <button class="outline" onclick="clearLog()">Clear Log</button>
    </div>

    <div id="log"></div>

    <!-- Hidden test areas -->
    <h2>Test: s-for rendering</h2>
    <div class="test-area" id="for-area">
        <div s-for="item of stressItems" s-key="item.id">
            <div class="item">{item.id}: {item.text}</div>
        </div>
        <div s-if="stressItems.length === 0" style="color: #555;">Empty — run the s-for test</div>
    </div>

    <h2>Test: Rapid s-bind updates</h2>
    <div class="test-area">
        <div s-bind="stressCounter" style="font-size: 1.5rem; color: #6366f1;">{stressCounter}</div>
    </div>

    <h2>Test: Many s-if elements</h2>
    <div class="test-area" id="if-area"></div>

    <h2>Test: Many s-bind elements</h2>
    <div class="test-area" id="bind-area"></div>

    <script>
        let store = {
            persist: false,
            data: {
                stressItems:   { type: Array, default: [] },
                stressCounter: { type: Number, default: 0 },
                stressToggle:  { type: Boolean, default: true },
                stressText:    { type: String, default: 'hello' }
            }
        };

        var logEl;
        function log(msg, cls) {
            if (!logEl) logEl = document.getElementById('log');
            var line = document.createElement('div');
            line.textContent = msg;
            if (cls) line.className = cls;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function bench(name, fn) {
            return new Promise(function(resolve) {
                // Allow DOM to settle
                requestAnimationFrame(function() {
                    var start = performance.now();
                    fn();
                    // Measure after next paint
                    requestAnimationFrame(function() {
                        var elapsed = (performance.now() - start).toFixed(1);
                        var cls = elapsed < 100 ? 'pass' : elapsed < 500 ? 'warn' : 'fail';
                        var verdict = elapsed < 100 ? 'FAST' : elapsed < 500 ? 'OK' : 'SLOW';
                        log('  ' + verdict + ' ' + name + ': ' + elapsed + 'ms', cls);
                        resolve(parseFloat(elapsed));
                    });
                });
            });
        }

        // === Test: s-for with large lists ===
        async function testForRendering() {
            log('\n--- s-for Rendering ---');

            // Clear
            stressItems.splice(0, stressItems.length);
            await new Promise(r => requestAnimationFrame(r));

            // 100 items
            await bench('Render 100 items', function() {
                for (var i = 0; i < 100; i++) {
                    stressItems.push({ id: i, text: 'Item number ' + i });
                }
            });

            // Clear and do 500
            stressItems.splice(0, stressItems.length);
            await new Promise(r => requestAnimationFrame(r));

            await bench('Render 500 items', function() {
                for (var i = 0; i < 500; i++) {
                    stressItems.push({ id: i, text: 'Item number ' + i });
                }
            });

            // Clear and do 1000
            stressItems.splice(0, stressItems.length);
            await new Promise(r => requestAnimationFrame(r));

            await bench('Render 1,000 items', function() {
                for (var i = 0; i < 1000; i++) {
                    stressItems.push({ id: i, text: 'Item number ' + i });
                }
            });

            // Splice from middle
            await bench('Remove 100 items from middle of 1,000', function() {
                stressItems.splice(450, 100);
            });

            // Add to end
            await bench('Push 100 items to 900-item list', function() {
                for (var i = 0; i < 100; i++) {
                    stressItems.push({ id: 10000 + i, text: 'New item ' + i });
                }
            });

            // Reverse
            await bench('Reverse 1,000-item list', function() {
                stressItems.reverse();
            });

            // Clear
            await bench('Clear 1,000-item list', function() {
                stressItems.splice(0, stressItems.length);
            });
        }

        // === Test: Rapid updates to a single variable ===
        async function testRapidUpdates() {
            log('\n--- Rapid s-bind Updates ---');

            await bench('1,000 counter updates', function() {
                for (var i = 0; i < 1000; i++) {
                    stressCounter = i;
                }
            });

            await bench('5,000 counter updates', function() {
                for (var i = 0; i < 5000; i++) {
                    stressCounter = i;
                }
            });

            await bench('10,000 counter updates', function() {
                for (var i = 0; i < 10000; i++) {
                    stressCounter = i;
                }
            });
        }

        // === Test: Many s-if elements ===
        async function testManyIfs() {
            log('\n--- Many s-if Elements ---');

            // Create 200 s-if elements
            var area = document.getElementById('if-area');
            area.innerHTML = '';
            for (var i = 0; i < 200; i++) {
                var el = document.createElement('span');
                el.setAttribute('s-if', 'stressToggle');
                el.textContent = i + ' ';
                el.style.fontSize = '0.7rem';
                el.style.color = '#555';
                area.appendChild(el);
            }
            // Re-init these elements by triggering an update
            await new Promise(r => requestAnimationFrame(r));

            await bench('Toggle 200 s-if elements ON', function() {
                stressToggle = true;
            });

            await bench('Toggle 200 s-if elements OFF', function() {
                stressToggle = false;
            });

            // Rapid toggle
            await bench('Toggle 200 s-if elements 100 times', function() {
                for (var i = 0; i < 100; i++) {
                    stressToggle = !stressToggle;
                }
            });
        }

        // === Test: Many s-bind elements ===
        async function testManyBinds() {
            log('\n--- Many s-bind Elements ---');

            var area = document.getElementById('bind-area');
            area.innerHTML = '';
            for (var i = 0; i < 200; i++) {
                var el = document.createElement('span');
                el.setAttribute('s-bind', 'stressText');
                el.textContent = '{stressText}';
                el.style.fontSize = '0.7rem';
                el.style.color = '#555';
                el.style.marginRight = '4px';
                area.appendChild(el);
            }
            await new Promise(r => requestAnimationFrame(r));

            await bench('Update 200 s-bind elements', function() {
                stressText = 'updated!';
            });

            await bench('Update 200 s-bind elements 100 times', function() {
                for (var i = 0; i < 100; i++) {
                    stressText = 'v' + i;
                }
            });
        }

        // === Test: Expression evaluation ===
        // sensible.exec is not exposed in browser mode, so we replicate it
        var _blocked = 'var document=void 0,window=void 0,self=void 0,globalThis=void 0,' +
            'fetch=void 0,XMLHttpRequest=void 0,Function=void 0,' +
            'importScripts=void 0,setTimeout=void 0,setInterval=void 0,' +
            'Proxy=void 0,Reflect=void 0;';
        function testExec(value) {
            return new Function('"use strict";' + _blocked + 'return ' + value + ';')();
        }

        async function testExpressions() {
            log('\n--- Expression Evaluation (in browser) ---');

            await bench('10,000 simple new Function() calls', function() {
                for (var i = 0; i < 10000; i++) {
                    testExec('1 + 1');
                }
            });

            await bench('10,000 ternary new Function() calls', function() {
                for (var i = 0; i < 10000; i++) {
                    testExec('true ? "yes" : "no"');
                }
            });

            await bench('10,000 Math.max new Function() calls', function() {
                for (var i = 0; i < 10000; i++) {
                    testExec('Math.max(1, 5, 3)');
                }
            });
        }

        // === Test: Memory ===
        async function testMemory() {
            log('\n--- Memory ---');
            if (!performance.memory) {
                log('  (performance.memory not available — use Chrome with --enable-precise-memory-info)', 'warn');
                return;
            }
            var before = performance.memory.usedJSHeapSize;

            // Create and destroy 1000 items
            for (var i = 0; i < 1000; i++) {
                stressItems.push({ id: i, text: 'Item ' + i });
            }
            await new Promise(r => requestAnimationFrame(r));
            await new Promise(r => requestAnimationFrame(r));

            var during = performance.memory.usedJSHeapSize;

            stressItems.splice(0, stressItems.length);
            await new Promise(r => requestAnimationFrame(r));
            await new Promise(r => requestAnimationFrame(r));

            var after = performance.memory.usedJSHeapSize;

            log('  Heap before: ' + (before / 1024 / 1024).toFixed(1) + ' MB');
            log('  Heap during (1000 items): ' + (during / 1024 / 1024).toFixed(1) + ' MB');
            log('  Heap after cleanup: ' + (after / 1024 / 1024).toFixed(1) + ' MB');
            var leaked = after - before;
            log('  Net change: ' + (leaked > 0 ? '+' : '') + (leaked / 1024).toFixed(1) + ' KB',
                leaked > 100000 ? 'fail' : leaked > 50000 ? 'warn' : 'pass');
        }

        // === Run All ===
        async function runAllTests() {
            clearLog();
            log('SensibleJS Stress Test');
            log('======================');
            log('Browser: ' + navigator.userAgent.split(' ').pop());
            log('');

            await testExpressions();
            await testRapidUpdates();
            await testManyBinds();
            await testManyIfs();
            await testForRendering();
            await testMemory();

            log('\n======================');
            log('Done!');
        }
    </script>
</body>
</html>
